name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]' build opencv-python-headless
      - name: Portable tests
        run: python -m pytest -q tests/maintenance tests/experiments/test_cli.py
      - name: Isolated public regression suite
        run: python tools/run_tests.py --suite all
      - name: Critical Python lint
        run: ruff check --select E9,F63,F7,F82 src scripts tools tests/maintenance
      - name: Offline source checks
        run: |
          python tools/check_public_tree.py
          python -m coevolve_experiments validate-scenes --mode planning
          python -m coevolve_experiments adapter-smoke --method all
          git diff --check
      - name: Build source distribution and wheel
        run: python -m build
      - name: Test installed wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/coevolve-wheel"
          "$RUNNER_TEMP/coevolve-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/coevolve-wheel/bin/python" -I -m coevolve_experiments adapter-smoke --method all
          "$RUNNER_TEMP/coevolve-wheel/bin/python" -I -m coevolve_experiments validate-scenes --mode planning --repo-root "$GITHUB_WORKSPACE"
